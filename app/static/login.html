<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Clínica Odontológica</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Agenda da Clínica</h1>
  </header>

  <main>
    <section class="card cartao-login">
      <h2>Entrar</h2>
      <form id="form-login">
        <label for="nome-usuario">Usuário</label>
        <input type="text" id="nome-usuario" autocomplete="username" required autofocus>

        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
      </form>
      <p id="mensagem" role="alert"></p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
