<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Odontológica</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Agenda da Clínica</h1>
    <div class="sessao">
      <span id="usuario-logado"></span>
      <button type="button" id="btn-sair">Sair</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Consultas do dia</h2>
      <label for="filtro-data">Data</label>
      <input type="date" id="filtro-data">
      <ul id="lista-consultas" class="lista-consultas"></ul>
    </section>

    <section class="card">
      <h2>Agendar consulta</h2>
      <form id="form-agendar">
        <label for="busca-paciente">Paciente</label>
        <div class="seletor">
          <input type="text" id="busca-paciente" autocomplete="off" required
                 placeholder="Digite o nome do paciente"
                 role="combobox" aria-autocomplete="list" aria-expanded="false"
                 aria-controls="opcoes-paciente">
          <ul id="opcoes-paciente" class="opcoes" role="listbox" hidden></ul>
        </div>

        <label for="busca-dentista">Dentista</label>
        <div class="seletor">
          <input type="text" id="busca-dentista" autocomplete="off" required
                 placeholder="Digite o nome do dentista"
                 role="combobox" aria-autocomplete="list" aria-expanded="false"
                 aria-controls="opcoes-dentista">
          <ul id="opcoes-dentista" class="opcoes" role="listbox" hidden></ul>
        </div>

        <label for="data-hora">Data e hora</label>
        <input type="datetime-local" id="data-hora" required>

        <label for="duracao">Duração</label>
        <select id="duracao">
          <option value="15">15 minutos</option>
          <option value="30" selected>30 minutos</option>
          <option value="45">45 minutos</option>
          <option value="60">1 hora</option>
          <option value="90">1h30</option>
          <option value="120">2 horas</option>
        </select>

        <label for="motivo">Motivo</label>
        <input type="text" id="motivo" required>

        <button type="submit">Agendar</button>
      </form>
      <p id="mensagem" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>Cadastrar paciente</h2>
      <form id="form-paciente">
        <label for="pac-nome">Nome</label>
        <input type="text" id="pac-nome" required>

        <label for="pac-cpf">CPF</label>
        <input type="text" id="pac-cpf" required inputmode="numeric" placeholder="Com ou sem pontuação">

        <label for="pac-telefone">Telefone</label>
        <input type="tel" id="pac-telefone" required>

        <button type="submit">Cadastrar paciente</button>
      </form>
      <p id="msg-paciente" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>Cadastrar dentista</h2>
      <form id="form-dentista">
        <label for="den-nome">Nome</label>
        <input type="text" id="den-nome" required>

        <label for="den-cro">CRO</label>
        <input type="text" id="den-cro" required placeholder="Ex.: CRO-DF-12345">

        <label for="den-especialidade">Especialidade</label>
        <input type="text" id="den-especialidade" required>

        <button type="submit">Cadastrar dentista</button>
      </form>
      <p id="msg-dentista" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
